version: 2
updates:
  # npm: package.json + package-lock.json na raiz (único manifest do repo).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # github-actions: `directory: "/"` faz o Dependabot varrer /.github/workflows
  # e o action.yml/action.yaml da raiz.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
