name: Neon preview boundary

# Pull requests execute only secretless checks. Remote Neon provisioning,
# migrations and readiness belong to the protected workflow_dispatch workflow
# and must run from develop or another explicitly approved SHA.

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: neon-preview-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Secretless Neon preview boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate migration drift without secrets
        # drizzle-kit check is purely local (migration snapshot validation) and
        # never connects; DATABASE_ADMIN_URL is only read by drizzle.config.ts
        # at load time, so a dummy value satisfies the guard without any secret.
        env:
          DATABASE_ADMIN_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npm run db:check

      - name: Record remote readiness boundary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Neon preview boundary"
            echo
            echo "- This pull-request job is secretless."
            echo "- No Neon API key, database URL, branch creation, migration, seed or remote database connection was used."
            echo "- PR head: \`$HEAD_SHA\`"
            echo "- PR base: \`$BASE_SHA\`"
            echo "- Remote Neon readiness requires the protected manual workflow from \`develop\`."
            echo "- A passing secretless boundary is not evidence of Neon readiness, reconciliation, backup/restore or cutover."
          } >> "$GITHUB_STEP_SUMMARY"
