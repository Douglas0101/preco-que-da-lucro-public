name: Neon drill ops

# Operações destrutivas/efêmeras de branch no projeto Neon, executadas via CI
# para que a NEON_API_KEY permaneça apenas em GitHub Secrets.
# Casos de uso autorizados: destruir branches sandbox/drill efêmeras,
# criar branches de drill a partir de production (cópia isolada, sem escrita
# na production) e inspecionar/criar snapshots nativos quando o plano suportar.
# Operações de leitura §13.7/§12.6: `pitr-status` mede a janela de PITR
# (scripts/m02-pitr-check.mjs) e `spend-status` faz o inventário de gasto
# (scripts/m02-neon-spend.mjs) — ambas SOMENTE GET, nenhum PATCH é emitido.
# O drill de PITR NUNCA toca a produção: o PITR restaura apenas branches raiz e
# SOBRESCREVE a branch restaurada, então qualquer ensaio usa projeto/branch
# descartável; a produção nunca é alvo de restore. Rollback pós-tráfego é
# snapshot/PITR — drizzle/rollback/0010_to_0009_down.sql permanece LOCKED.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação a executar"
        required: true
        type: choice
        options:
          - list-branches
          - create-drill-branch
          - delete-branch
          - snapshot-list
          - snapshot-create
          - pitr-status
          - spend-status
      branch_id:
        description: "ID do branch alvo (obrigatório para delete-branch e snapshot-*)"
        required: false
        type: string
      drill_branch_name:
        description: "Nome do branch de drill a criar (obrigatório para create-drill-branch)"
        required: false
        type: string
      confirm:
        description: "Confirmação obrigatória para delete-branch e snapshot-create"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: neon-drill-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drill-ops:
    name: Neon drill ops / ${{ inputs.operation }}
    environment:
      name: neon-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require registered ref
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            develop|main) ;;
            *) echo "Neon drill ops blocked: run only from develop or main." >&2; exit 1 ;;
          esac

      - name: Require credentials and validate inputs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
          BRANCH_ID: ${{ inputs.branch_id }}
          DRILL_BRANCH_NAME: ${{ inputs.drill_branch_name }}
        run: |
          set -euo pipefail
          [[ -n "$NEON_API_KEY" ]] || { echo "Neon drill ops blocked: NEON_API_KEY secret ausente." >&2; exit 1; }
          [[ -n "$NEON_PROJECT_ID" ]] || { echo "Neon drill ops blocked: NEON_PROJECT_ID var ausente." >&2; exit 1; }
          case "$OPERATION" in
            delete-branch)
              [[ "$CONFIRM" == "true" ]] || { echo "delete-branch exige confirm=true." >&2; exit 1; }
              [[ -n "$BRANCH_ID" ]] || { echo "delete-branch exige branch_id." >&2; exit 1; }
              ;;
            create-drill-branch)
              [[ -n "$DRILL_BRANCH_NAME" ]] || { echo "create-drill-branch exige drill_branch_name." >&2; exit 1; }
              ;;
            snapshot-list|snapshot-create)
              [[ -n "$BRANCH_ID" ]] || { echo "snapshot-* exige branch_id." >&2; exit 1; }
              ;;
            pitr-status|spend-status) ;;
            list-branches) ;;
            *) echo "Operação não suportada." >&2; exit 1 ;;
          esac

      - name: Checkout (só para as leituras §13.7/§12.6)
        if: inputs.operation == 'pitr-status' || inputs.operation == 'spend-status'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List branches
        if: inputs.operation == 'list-branches'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_BASE: https://console.neon.tech/api/v2
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.NEON_API_BASE;
          const projectId = process.env.NEON_PROJECT_ID;
          const response = await fetch(`${base}/projects/${projectId}/branches`, {
            headers: { Authorization: `Bearer ${process.env.NEON_API_KEY}`, Accept: "application/json" },
          });
          if (!response.ok) throw new Error(`list-branches HTTP ${response.status}`);
          const payload = await response.json();
          for (const branch of payload.branches ?? []) {
            console.log([branch.id, branch.name, branch.primary ? "primary" : "", branch.created_at].join(" | "));
          }
          NODE

      - name: PITR status §13.7 (janela de histórico vs SDD §16.6)
        if: inputs.operation == 'pitr-status'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_BASE: https://console.neon.tech/api/v2
          ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/neon-drill-ops
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          # SOMENTE GET: elevar a janela é passo humano de H-4 (plano pago), não
          # deste workflow. Exit 0 = PASS ou SKIP rotulado (sem chave nada é
          # chamado e a janela fica NÃO MEDIDA); 1 = FAIL (janela < mínimo →
          # BAK-01b aberto); 2 = INCOMPLETE (fail-closed). Run verde = janela
          # medida e conforme, que é exatamente a evidência de fechamento.
          RC=0
          node scripts/m02-pitr-check.mjs > "$ARTIFACT_DIR/pitr-status.json" || RC=$?
          if [ -s "$ARTIFACT_DIR/pitr-status.json" ]; then
            node --input-type=module -e '
              import { appendFileSync, readFileSync } from "node:fs";
              const report = JSON.parse(readFileSync(`${process.env.ARTIFACT_DIR}/pitr-status.json`, "utf8"));
              appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `- PITR §13.7: result=${report.result} · janela=${report.history_retention_seconds ?? "n/d"} s · mínimo=${report.min_seconds ?? "n/d"} s\n`,
              );
            '
            cat "$ARTIFACT_DIR/pitr-status.json"
          fi
          exit "$RC"

      - name: Spend status §12.6 (inventário; saída SOMENTE hostnames)
        if: inputs.operation == 'spend-status'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_BASE: https://console.neon.tech/api/v2
          ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/neon-drill-ops
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          # SOMENTE GET e saída sem URL de conexão/chave/id: o relatório é
          # publicável como está. spending_limit e consumption v2 NÃO são
          # tocados (exigem plano pago — H-4).
          RC=0
          node scripts/m02-neon-spend.mjs > "$ARTIFACT_DIR/spend-status.json" || RC=$?
          if [ -s "$ARTIFACT_DIR/spend-status.json" ]; then
            node --input-type=module -e '
              import { appendFileSync, readFileSync } from "node:fs";
              const report = JSON.parse(readFileSync(`${process.env.ARTIFACT_DIR}/spend-status.json`, "utf8"));
              appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `- Spend §12.6: result=${report.result} · branches=${report.branches?.count ?? "n/d"} · hostnames=${(report.hostnames ?? []).join(",") || "n/d"}\n- Alerta SOMENTE e-mail e NÃO suspende compute: não é guardrail forte; spending_limit/consumption v2 dependem de H-4 (plano pago) + chave de escopo de organização.\n`,
              );
            '
            cat "$ARTIFACT_DIR/spend-status.json"
          fi
          exit "$RC"

      - name: Upload leituras §13.7/§12.6
        if: always() && (inputs.operation == 'pitr-status' || inputs.operation == 'spend-status')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-drill-ops-${{ inputs.operation }}-${{ github.run_id }}
          path: .artifacts/neon-drill-ops
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Create drill branch from production
        if: inputs.operation == 'create-drill-branch'
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # Drill branches são cópias isoladas da production; a production
          # em si nunca é alvo de escrita por este workflow.
          parent_branch: production
          branch_name: ${{ inputs.drill_branch_name }}

      - name: Report drill branch
        if: inputs.operation == 'create-drill-branch'
        env:
          DRILL_BRANCH_NAME: ${{ inputs.drill_branch_name }}
          DRILL_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          [[ -n "$DRILL_BRANCH_ID" ]] || { echo "branch_id não retornado." >&2; exit 1; }
          echo "drill_branch_id=$DRILL_BRANCH_ID"
          echo "- Drill branch criado: $DRILL_BRANCH_NAME (id no log privado)" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete branch
        if: inputs.operation == 'delete-branch'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ inputs.branch_id }}

      - name: Snapshot list
        if: inputs.operation == 'snapshot-list'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_BASE: https://console.neon.tech/api/v2
          BRANCH_ID: ${{ inputs.branch_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.NEON_API_BASE;
          const url = `${base}/projects/${process.env.NEON_PROJECT_ID}/branches/${process.env.BRANCH_ID}/snapshots`;
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.NEON_API_KEY}`, Accept: "application/json" },
          });
          // 404/400 aqui é evidência de que o plano não expõe snapshots nativos.
          console.log(`http_status=${response.status}`);
          console.log(JSON.stringify(await response.json(), null, 2));
          NODE

      - name: Snapshot create
        if: inputs.operation == 'snapshot-create'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_BASE: https://console.neon.tech/api/v2
          BRANCH_ID: ${{ inputs.branch_id }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "true" ]] || { echo "snapshot-create exige confirm=true." >&2; exit 1; }
          node --input-type=module <<'NODE'
          const base = process.env.NEON_API_BASE;
          const url = `${base}/projects/${process.env.NEON_PROJECT_ID}/branches/${process.env.BRANCH_ID}/snapshots`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${process.env.NEON_API_KEY}`,
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: "{}",
          });
          console.log(`http_status=${response.status}`);
          console.log(JSON.stringify(await response.json(), null, 2));
          NODE
