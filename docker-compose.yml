services:
  postgres:
    image: postgres:17-alpine
    container_name: preco-que-da-lucro-postgres
    environment:
      POSTGRES_DB: preco_que_da_lucro_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d preco_que_da_lucro_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
